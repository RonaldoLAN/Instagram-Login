<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrapper">
        
        <div id="container">
            
            <div class="column left">
                <div class="main"></div>
            </div>
            
            <div class="column right">
                
                <div class="login-painel">
                    <div class="logo">
                        <img src="./images/Instagram_logo.svg.jpeg" alt="logo do instagram" class="logo-img">
                    </div>
                    <form action="login">
                        <input type="text" placeholder="Telefone, Usuário ou Email" name="username">
                        <input type="password" placeholder="Senha" name="password">

                        <input type="submit" value="Entrar">
                    </form>
                </div>
                
                <div class="infobox">
                    <p>Não possui uma conta? <a href="#">Cadastre-se</a></p>
                </div>

                <div class="get-app">
                    Obtenha o aplicativo.
                    <div class="app-buttons">
                        <a href="https://apps.apple.com/br/app/instagram/id389801252" target="_blank">
                            <img src="./images/appstore.png" alt="Baixe na AppStore">
                        </a>
                        <a href="https://play.google.com/store/apps/details?id=com.instagram.android&pcampaignid=web_share" target="_blank">
                            <img src="./images/googleplay.png" alt="Baixe na GooglePlay">
                        </a>
                    </div>
                </div>

            </div>
        
        </div>
    
    </div>
</body>
</html>
