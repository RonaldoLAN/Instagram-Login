<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça seu cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrapper">
        
        <div id="container-signup">
            
            <div class="column">
                
                <div class="login-painel">
                    <div class="logo">
                        <img src="./images/Instagram_logo.svg.jpeg" alt="logo do instagram" class="logo-img">
                    </div>

                    <div class="mensagem">
                        <span>Cadastre-se para ver fotos e vídeos de seus amigos.</span>
                    </div>

                    <button class="cta-button">
                        Entrar com Facebook
                    </button>

                    <div class="divisor-container">
                        <div class="line"></div>
                        <div class="divisor-tag">ou</div>
                        <div class="line"></div>
                    </div>

                    <form action="login">
                        <input type="text" placeholder="Número de celular ou Email" name="email">
                        <input type="text" placeholder="Nome completo" name="name">
                        <input type="text" placeholder="Nome do usuário" name="username">
                        <input type="password" placeholder="Senha" name="password">

                        <input type="submit" value="Entrar">
                    </form>
                </div>
                
                <div class="infobox">
                    <p>Tem uma conta? <a href="index.html">Conecte-se</a></p>
                </div>

                <div class="get-app">
                    Obtenha o aplicativo.
                    <div class="app-buttons">
                        <a href="https://apps.apple.com/br/app/instagram/id389801252" target="_blank">
                            <img src="./images/appstore.png" alt="Baixe na AppStore">
                        </a>
                        <a href="https://play.google.com/store/apps/details?id=com.instagram.android&pcampaignid=web_share" target="_blank">
                            <img src="./images/googleplay.png" alt="Baixe na GooglePlay">
                        </a>
                    </div>
                </div>

            </div>
        
        </div>

        <footer>
            <div class="footer-inner"> 
                <a href="#">Meta</a>
                <a href="#">Sobre</a>
                <a href="#">Blog</a>
                <a href="#">Carreiras</a>
                <a href="#">Ajuda</a>
                <a href="#">API</a>
                <a href="#">Privacidade</a>
                <a href="#">Termos</a>
                <a href="#">Localizações</a>
                <a href="#">Popular</a>
                <a href="#">Instagram Lite</a>
                <a href="#">Meta AI</a>
                <div class="text-small">@ 2026 Instagram</div>
            </div>
        </footer>
    
    </div>
</body>
</html>
